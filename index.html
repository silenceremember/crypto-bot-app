<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>crypto-bot</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:var(--tg-theme-bg-color,#fff);--fg:var(--tg-theme-text-color,#111);--mut:var(--tg-theme-hint-color,#888);
--card:var(--tg-theme-secondary-bg-color,#f2f2f5);--acc:var(--tg-theme-button-color,#2f7cf6);--accfg:var(--tg-theme-button-text-color,#fff);
--ok:#1a9a4a;--warn:#c98a12;--bad:#e5484d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.4 -apple-system,system-ui,Segoe UI,sans-serif}
nav{position:sticky;top:0;display:flex;background:var(--bg);border-bottom:1px solid var(--card);z-index:2}
nav button{flex:1;padding:11px 4px;border:0;background:none;color:var(--mut);font:inherit;font-weight:600}
nav button.on{color:var(--acc);box-shadow:inset 0 -2px 0 var(--acc)}
main{padding:12px 12px 40px}
.card{background:var(--card);border-radius:12px;padding:12px;margin-bottom:10px;overflow:hidden}
h3{margin:0 0 8px;font-size:12px;color:var(--mut);font-weight:700;text-transform:uppercase;letter-spacing:.04em;
white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
h3 .sub{text-transform:none;letter-spacing:0;font-weight:500}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{min-width:0}.kpi b{display:block;font-size:17px;white-space:nowrap}.kpi span{color:var(--mut);font-size:12px}
.row{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--bg);min-width:0}
.row:first-of-type{border-top:0}
.row .main{flex:1;min-width:0}.row .side{flex:none;text-align:right;white-space:nowrap}
.one{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mut{color:var(--mut)}.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}
.small{font-size:12px}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:12px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--mut);margin-right:6px;vertical-align:1px}
.dot.ok{background:var(--ok)}.dot.warn{background:var(--warn)}.dot.bad{background:var(--bad)}
.step{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--bg)}.step:first-of-type{border-top:0}
.step .n{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;
background:var(--bg);color:var(--mut)}
.step.done .n{background:var(--ok);color:#fff}.step.run .n{background:var(--acc);color:var(--accfg)}
.step .main{flex:1;min-width:0}.step .t{font-weight:600}
.bar{height:6px;background:var(--bg);border-radius:3px;margin:5px 0 3px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--acc);border-radius:3px}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11px;font-weight:600;background:var(--bg);color:var(--mut)}
.pill.ok{color:var(--ok)}.pill.bad{color:#fff;background:var(--bad)}
button.act{border:0;border-radius:10px;padding:7px 12px;background:var(--acc);color:var(--accfg);font:inherit;font-weight:600;font-size:13px}
button.danger{background:var(--bad);color:#fff}
a{color:var(--acc);text-decoration:none}
#err{display:none;background:var(--bad);color:#fff;padding:10px 12px}
</style>
</head>
<body>
<div id="err"></div>
<nav id="tabs"></nav>
<main id="view"><p class="mut">Loading…</p></main>
<script>
const tg = window.Telegram && Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }
const TABS = [["home","Overview"],["trades","Trades"],["feeds","Data"]];
let tab = "home", S = null;

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const sol = x => x == null ? "–" : (x >= 0 ? "+" : "") + Number(x).toFixed(4);
const pct = x => x == null ? "–" : (x >= 0 ? "+" : "") + (x * 100).toFixed(1) + "%";
const ago = t => { if (!t) return "–"; const s = Date.now() / 1000 - t; return s < 90 ? Math.round(s) + "s" : s < 5400 ? Math.round(s / 60) + "m" : Math.round(s / 3600) + "h"; };
const dur = s => s == null ? "–" : s < 90 ? Math.round(s) + "s" : s < 5400 ? Math.round(s / 60) + "m" : (s / 3600).toFixed(1) + "h";
const short = m => m ? esc(m.slice(0, 4) + "…" + m.slice(-4)) : "";
const cls = x => x == null ? "" : x > 0 ? "ok" : x < 0 ? "bad" : "";
// one line, cut with an ellipsis; the full text on long press (title)
const one = (t, c = "") => t ? `<span class="one ${c}" title="${esc(t)}">${esc(t)}</span>` : "";

// Served from GitHub Pages (permanent address): the data API lives on the owner's PC behind a tunnel
// whose address changes; the bot keeps it in tunnel.json of this repo. Served from the tunnel: same origin.
const ON_PAGES = location.hostname.endsWith("github.io");
let BASE = ON_PAGES ? null : "";
async function findBase() {
  const owner = location.hostname.split(".")[0], repo = location.pathname.split("/")[1];
  const r = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/tunnel.json?t=${Date.now()}`,
                        {headers: {"Accept": "application/vnd.github.raw+json"}, cache: "no-store"});
  if (!r.ok) throw new Error("Cannot read the bot address (GitHub " + r.status + ")");
  BASE = (await r.json()).api.replace(/\/$/, "");
}
async function api(path, body, retried) {
  if (BASE === null) await findBase();
  let r;
  try {
    r = await fetch(BASE + path, {method: body ? "POST" : "GET", headers: {"X-Init-Data": tg ? tg.initData : "",
                    "Content-Type": "application/json"}, body: body ? JSON.stringify(body) : undefined});
  } catch (e) { r = null; }
  // tunnel gone or moved: re-read the current address once, then retry
  if ((!r || [404, 502, 503, 530].includes(r.status)) && ON_PAGES && !retried) {
    BASE = null;
    return api(path, body, true);
  }
  if (!r) throw new Error("Bot is offline (PC or tunnel down). Retrying…");
  if (r.status === 401) throw new Error("Unauthorized: open this from your paired Telegram bot.");
  if (!r.ok) throw new Error("HTTP " + r.status);
  return r.json();
}
function showErr(e) { const b = document.getElementById("err"); b.style.display = e ? "block" : "none"; b.textContent = e || ""; }

let busy = false;     // one poll at a time: a slow answer must not stack the next ones behind it
async function refresh() {
  if (busy) return;
  busy = true;
  try { S = await api("/api/state"); showErr(""); render(); } catch (e) { showErr(e.message); } finally { busy = false; }
}
const ask = t => new Promise(r => tg && tg.showConfirm ? tg.showConfirm(t, r) : r(confirm(t)));
async function action(body, confirmText) {
  if (confirmText && !(await ask(confirmText))) return;
  if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred("light");
  try { await api("/api/action", body); await refresh(); } catch (e) { showErr(e.message); }
}

function nav() {
  document.getElementById("tabs").innerHTML = TABS.map(([k, t]) =>
    `<button class="${k === tab ? "on" : ""}" onclick="tab='${k}';render()">${t}</button>`).join("");
}

function pipeline() {
  const P = S.pipeline || {steps: []};
  const steps = P.steps.map((s, i) => {
    const c = s.running ? "run" : s.done ? "done" : "";
    const pr = s.progress;
    const bar = pr && pr.pct != null ? `<div class="bar"><i style="width:${pr.pct}%"></i></div>` : "";
    return `<div class="step ${c}"><span class="n">${s.done && !s.running ? "✓" : i + 1}</span><div class="main">
      <span class="one t">${esc(s.title)} ${s.running ? '<span class="pill ok">running</span>' : ""}</span>
      ${one(s.detail, "mut small")}${bar}${pr ? one(pr.text, "mut small") : ""}</div></div>`;
  }).join("");
  const head = `autopilot <span class="${P.live ? "ok" : "bad"}">${P.live ? "live" : "not running"}</span>` +
               (P.next_discover_s ? ` · next search ${dur(P.next_discover_s)}` : "");
  return `<div class="card"><h3>Pipeline <span class="sub">· ${head}</span></h3>${steps}</div>`;
}

function reviews() {
  const R = S.reviews || [];
  if (!R.length) return "";
  return `<div class="card"><h3>Data for reviews <span class="sub">· until each method can be judged</span></h3>` + R.map(r =>
    `<div class="step ${r.pct >= 100 ? "done" : ""}"><span class="n">${r.pct >= 100 ? "✓" : "…"}</span><div class="main">
      <span class="one t">${esc(r.title)}</span><div class="bar"><i style="width:${r.pct}%"></i></div>${one(r.text, "mut small")}</div></div>`).join("") + `</div>`;
}

function server() {
  const R = S.server || [];
  if (!R.length) return "";
  return `<div class="card"><h3>Server <span class="sub">· a full bar is a problem</span></h3>` + R.map(r =>
    `<div class="step"><span class="n">·</span><div class="main">
      <span class="one t">${esc(r.title)}</span><div class="bar"><i style="width:${r.pct}%"></i></div>${one(r.text, "mut small")}</div></div>`).join("") + `</div>`;
}

function runCard(r, title, hint) {
  if (!r) return `<div class="card"><h3>${title} <span class="sub">· ${hint}</span></h3><span class="mut small">not started yet</span></div>`;
  return `<div class="card"><h3>${title} <span class="sub">· running ${dur(Date.now() / 1000 - r.since)}</span></h3><div class="grid">
    <div class="kpi"><b class="${cls(r.pnl_sol)}">${sol(r.pnl_sol)}</b><span>PnL SOL</span></div>
    <div class="kpi"><b>${r.closed}</b><span>closed</span></div>
    <div class="kpi"><b>${r.win_rate == null ? "–" : Math.round(r.win_rate * 100) + "%"}</b><span>win rate</span></div>
    <div class="kpi"><b>${r.open}</b><span>open</span></div>
    <div class="kpi"><b>${r.entries}</b><span>entries</span></div>
    <div class="kpi"><b>${r.signals}</b><span>signals</span></div></div></div>`;
}

function results() {
  const R = S.results;
  if (!R || !R.view) return "";
  const row = v => {
    const g = R[v.key], l = g.last, a = g.at_stake;
    const roi = g.invested ? g.pnl_sol / g.invested : null;
    return `<div class="row"><span class="main"><span class="one">${esc(v.title)}
        <span class="mut small"> · ${g.closed} closed · win ${g.win_rate == null ? "–" : Math.round(g.win_rate * 100) + "%"} · open ${g.open}</span></span>
        <span class="one mut small">w/o best ${sol(g.pnl_ex_best)}${a && a.n ? ` · at ${a.stake} SOL <b class="${cls(a.pnl_sol)}">${sol(a.pnl_sol)}</b>` : ""}</span>
        ${l ? `<span class="one small">last: <a class="mono" href="https://gmgn.ai/sol/token/${esc(l.mint)}">${short(l.mint)}</a>
          <b class="${cls(l.pnl_sol)}">${sol(l.pnl_sol)}</b> <span class="mut">${esc(l.reason)} · ${ago(l.ts)}</span></span>` : ""}</span>
      <span class="side"><b class="${cls(g.pnl_sol)}" style="font-size:16px">${g.closed ? sol(g.pnl_sol) : "–"}</b><br>
        <span class="small ${cls(roi)}">${roi == null ? "" : pct(roi)}</span></span></div>`;
  };
  const e = R.view.earlier || {};
  const old = Object.keys(e).filter(k => e[k].closed).map(k => `${k} ${sol(e[k].pnl_sol)} (${e[k].closed})`).join(" · ");
  return `<div class="card"><h3>Results <span class="sub">· trailing exit, SOL, fees included</span></h3>${R.view.rows.map(row).join("")}
    ${old ? `<div class="one mut small">Before: old exit rule ${old}</div>` : ""}</div>`;
}

function home() {
  const R = S.runs || {};
  const halted = S.risk.filter(r => r.halted);
  const open = S.open.length ? S.open.map(p => `<div class="row"><span class="main">
       <a class="mono" href="https://gmgn.ai/sol/token/${esc(p.mint)}">${short(p.mint)}</a>
       <span class="mut small"> · ${esc(p.src || "")}</span></span><span class="side mut small">${dur(p.age_s)}</span></div>`).join("")
     : `<span class="mut small">none</span>`;
  return `<div class="card"><div class="row"><span class="main"><span class="one">Kill switch
        <span class="pill ${S.kill ? "bad" : "ok"}">${S.kill ? "ON: entries blocked" : "off"}</span></span></span>
      <span class="side"><button class="act ${S.kill ? "" : "danger"}" onclick='action({action:"kill_toggle"},"${S.kill ? "Turn kill switch OFF?" : "Block all new entries?"}")'>${S.kill ? "Turn off" : "Stop entries"}</button></span></div></div>
    ${halted.length ? `<div class="card"><h3>Live limits hit <span class="sub">· paper keeps trading</span></h3>${halted.map(r => `<div class="row"><span class="main">${one(r.key.slice(11) || "paper")}</span><span class="side warn">${esc(r.halted)}</span></div>`).join("")}</div>` : ""}
    ${results()}
    ${pipeline()}
    ${reviews()}
    ${server()}
    <div class="card"><h3>Open positions</h3>${open}</div>
    <div class="card"><h3>Autopilot</h3>${(S.events || []).map(e => `<div class="row"><span class="main">${one(e.what)}</span>
       <span class="side mut small">${ago(e.ts)}</span></div>`).join("") || '<span class="mut small">no events</span>'}</div>`;
}

function trades() {
  const icon = {enter: "🟢", exit: "⚪", partial_exit: "◐", skip: "·", halt: "⛔"};
  const rows = S.decisions.filter(d => d.run && d.run.startsWith("paper") && d.reason !== "already_open");
  return `<div class="card"><h3>Trades <span class="sub">· latest</span></h3>` + (rows.map(d => `<div class="row">
     <span class="main"><span class="one">${icon[d.action] || "•"} <b>${esc(d.action)}</b> <span class="mut">${esc(d.reason || "")}</span></span>
       <span class="one mono mut">${d.run.startsWith("paper-probe") ? "probe" : d.run.startsWith("paper-watch") ? "watch" : d.run.startsWith("paper-filt") ? "filt" : d.run.startsWith("paper-repfix") ? "repfix" : d.run.startsWith("paper-rep") ? "rep" : "followed"}${d.mint ? ` · <a href="https://gmgn.ai/sol/token/${esc(d.mint)}">${short(d.mint)}</a>` : ""}</span></span>
     <span class="side">${d.pnl_sol != null ? `<b class="${cls(d.pnl_sol)}">${sol(d.pnl_sol)}</b><br>` : ""}
       <span class="mut small">${d.roi != null ? pct(d.roi) + " · " : ""}${ago(d.ts)}</span></span></div>`).join("")
     || '<span class="mut small">no trades yet</span>') + `</div>`;
}

function feeds() {
  const prov = S.providers.map(p => `<div class="row"><span class="main"><span class="one"><span class="dot ${p.state}"></span>${esc(p.name)}
       ${p.public ? "<span class='mut small'>public</span>" : ""}${p.via_proxy ? " <span class='mut small'>via proxy</span>" : ""}</span>
       ${p.error ? one(p.error, (p.state === "bad" ? "bad" : "warn") + " small") : ""}</span>
     <span class="side small">${p.today.toLocaleString()}${p.budget ? `<span class="mut"> / ${p.budget.toLocaleString()}</span>` : ""}</span></div>`).join("");
  const fd = S.feeds.map(f => `<div class="row"><span class="main"><span class="one"><span class="dot ${f.state}"></span>${esc(f.feed)}</span>
       ${f.error ? one(f.error, (f.ok ? "warn" : "bad") + " small") : one(f.note, "mut small")}</span>
     <span class="side mut small">${ago(f.last_ok_ts)}</span></div>`).join("");
  return `<div class="card"><h3>Data feeds</h3>${fd || "<span class='mut small'>none yet</span>"}</div>
     <div class="card"><h3>RPC providers <span class="sub">· calls today</span></h3>${prov}</div>`;
}

function render() {
  nav();
  if (!S) return;
  document.getElementById("view").innerHTML = ({home, trades, feeds})[tab]();
}
nav(); refresh(); setInterval(refresh, 5000);
</script>
</body>
</html>
