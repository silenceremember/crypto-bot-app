<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>crypto-bot</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:var(--tg-theme-bg-color,#fff);--fg:var(--tg-theme-text-color,#111);--mut:var(--tg-theme-hint-color,#888);
--card:var(--tg-theme-secondary-bg-color,#f2f2f5);--acc:var(--tg-theme-button-color,#2f7cf6);--accfg:var(--tg-theme-button-text-color,#fff);
--ok:#1a9a4a;--warn:#c98a12;--bad:#e5484d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.4 -apple-system,system-ui,Segoe UI,sans-serif}
nav{position:sticky;top:0;display:flex;background:var(--bg);border-bottom:1px solid var(--card);z-index:2}
nav button{flex:1;padding:11px 4px;border:0;background:none;color:var(--mut);font:inherit;font-weight:600}
nav button.on{color:var(--acc);box-shadow:inset 0 -2px 0 var(--acc)}
main{padding:12px 12px 40px}
.card{background:var(--card);border-radius:12px;padding:12px;margin-bottom:10px;overflow:hidden}
h3{margin:0 0 8px;font-size:12px;color:var(--mut);font-weight:700;text-transform:uppercase;letter-spacing:.04em;
white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
h3 .sub{text-transform:none;letter-spacing:0;font-weight:500}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{min-width:0}.kpi b{display:block;font-size:17px;white-space:nowrap}.kpi span{color:var(--mut);font-size:12px}
.row{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--bg);min-width:0}
.row:first-of-type{border-top:0}
.row .main{flex:1;min-width:0}.row .side{flex:none;text-align:right;white-space:nowrap}
.one{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mut{color:var(--mut)}.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}
.small{font-size:12px}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:12px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--mut);margin-right:6px;vertical-align:1px}
.dot.ok{background:var(--ok)}.dot.warn{background:var(--warn)}.dot.bad{background:var(--bad)}
.step{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--bg)}.step:first-of-type{border-top:0}
.step .n{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;
background:var(--bg);color:var(--mut)}
.step.done .n{background:var(--ok);color:#fff}.step.run .n{background:var(--acc);color:var(--accfg)}
.step .main{flex:1;min-width:0}.step .t{font-weight:600}
.bar{height:6px;background:var(--bg);border-radius:3px;margin:5px 0 3px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--acc);border-radius:3px}
.rv-sec{font-size:11px;font-weight:700;color:var(--mut);margin:10px 0 2px;text-transform:uppercase;letter-spacing:.04em}
.rv{padding:7px 0 7px 10px;border-left:3px solid var(--bg);margin:3px 0}.rv .t{font-weight:600;min-width:0}
.rv-head{display:flex;gap:8px;align-items:center;justify-content:space-between}
.rv-collecting{border-left-color:var(--acc)}.rv-due{border-left-color:var(--warn)}.rv-due .bar>i{background:var(--warn)}
.rv-pass{border-left-color:var(--ok)}.rv-pass .bar>i{background:var(--ok)}
.rv-fail{border-left-color:var(--bad)}.rv-fail .bar>i{background:var(--bad)}
.pill.warn{color:var(--warn)}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11px;font-weight:600;background:var(--bg);color:var(--mut)}
.pill.ok{color:var(--ok)}.pill.bad{color:#fff;background:var(--bad)}
.gauges{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}.gauges .pill{background:var(--card)}
.st{padding:8px 0;border-top:1px solid var(--bg)}.st:first-of-type{border-top:0}
.st-head{display:flex;align-items:baseline;gap:8px}.st-head .main{flex:1;min-width:0;font-weight:600}
.st-head .side{flex:none;font-weight:700;font-size:15px}
.rule{display:flex;align-items:center;gap:8px;padding:4px 0 4px 10px;border-left:3px solid var(--bg);margin:3px 0 0}
.rule .main{flex:1;min-width:0}.rule .side{flex:none;text-align:right;white-space:nowrap}
.rule-pass{border-left-color:var(--ok)}.rule-fail{border-left-color:var(--bad)}.rule-collecting{border-left-color:var(--acc)}
.mini{display:inline-block;width:44px;height:5px;background:var(--bg);border-radius:3px;overflow:hidden;vertical-align:2px}
.mini>i{display:block;height:100%;background:var(--acc)}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}.chips .pill{font-weight:500}
button.act{border:0;border-radius:10px;padding:7px 12px;background:var(--acc);color:var(--accfg);font:inherit;font-weight:600;font-size:13px}
button.danger{background:var(--bad);color:#fff}
a{color:var(--acc);text-decoration:none}
#err{display:none;background:var(--bad);color:#fff;padding:10px 12px}
</style>
</head>
<body>
<div id="err"></div>
<nav id="tabs"></nav>
<main id="view"><p class="mut">Loading…</p></main>
<script>
const tg = window.Telegram && Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }
const TABS = [["home","Overview"],["trades","Trades"],["feeds","System"]];
let tab = "home", S = null;

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const sol = x => x == null ? "–" : (x >= 0 ? "+" : "") + Number(x).toFixed(4);
const pct = x => x == null ? "–" : (x >= 0 ? "+" : "") + (x * 100).toFixed(1) + "%";
const ago = t => { if (!t) return "–"; const s = Date.now() / 1000 - t; return s < 90 ? Math.round(s) + "s" : s < 5400 ? Math.round(s / 60) + "m" : Math.round(s / 3600) + "h"; };
const dur = s => s == null ? "–" : s < 90 ? Math.round(s) + "s" : s < 5400 ? Math.round(s / 60) + "m" : (s / 3600).toFixed(1) + "h";
const short = m => m ? esc(m.slice(0, 4) + "…" + m.slice(-4)) : "";
const cls = x => x == null ? "" : x > 0 ? "ok" : x < 0 ? "bad" : "";
// one line, cut with an ellipsis; the full text on long press (title)
const one = (t, c = "") => t ? `<span class="one ${c}" title="${esc(t)}">${esc(t)}</span>` : "";

// Served from GitHub Pages (permanent address): the data API lives on the owner's PC behind a tunnel
// whose address changes; the bot keeps it in tunnel.json of this repo. Served from the tunnel: same origin.
const ON_PAGES = location.hostname.endsWith("github.io");
let BASE = ON_PAGES ? null : "";
async function findBase() {
  const owner = location.hostname.split(".")[0], repo = location.pathname.split("/")[1];
  const r = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/tunnel.json?t=${Date.now()}`,
                        {headers: {"Accept": "application/vnd.github.raw+json"}, cache: "no-store"});
  if (!r.ok) throw new Error("Cannot read the bot address (GitHub " + r.status + ")");
  BASE = (await r.json()).api.replace(/\/$/, "");
}
async function api(path, body, retried) {
  if (BASE === null) await findBase();
  let r;
  try {
    r = await fetch(BASE + path, {method: body ? "POST" : "GET", headers: {"X-Init-Data": tg ? tg.initData : "",
                    "Content-Type": "application/json"}, body: body ? JSON.stringify(body) : undefined});
  } catch (e) { r = null; }
  // tunnel gone or moved: re-read the current address once, then retry
  if ((!r || [404, 502, 503, 530].includes(r.status)) && ON_PAGES && !retried) {
    BASE = null;
    return api(path, body, true);
  }
  if (!r) throw new Error("Bot is offline (PC or tunnel down). Retrying…");
  if (r.status === 401) throw new Error("Unauthorized: open this from your paired Telegram bot.");
  if (!r.ok) throw new Error("HTTP " + r.status);
  return r.json();
}
function showErr(e) { const b = document.getElementById("err"); b.style.display = e ? "block" : "none"; b.textContent = e || ""; }

let busy = false;     // one poll at a time: a slow answer must not stack the next ones behind it
async function refresh() {
  if (busy) return;
  busy = true;
  try { S = await api("/api/state"); showErr(""); render(); } catch (e) { showErr(e.message); } finally { busy = false; }
}
const ask = t => new Promise(r => tg && tg.showConfirm ? tg.showConfirm(t, r) : r(confirm(t)));
async function action(body, confirmText) {
  if (confirmText && !(await ask(confirmText))) return;
  if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred("light");
  try { await api("/api/action", body); await refresh(); } catch (e) { showErr(e.message); }
}

function nav() {
  document.getElementById("tabs").innerHTML = TABS.map(([k, t]) =>
    `<button class="${k === tab ? "on" : ""}" onclick="tab='${k}';render()">${t}</button>`).join("");
}

function pipeline() {
  const P = S.pipeline || {steps: []};
  const steps = P.steps.map((s, i) => {
    const c = s.running ? "run" : s.done ? "done" : "";
    const pr = s.progress;
    const bar = pr && pr.pct != null ? `<div class="bar"><i style="width:${pr.pct}%"></i></div>` : "";
    return `<div class="step ${c}"><span class="n">${s.done && !s.running ? "✓" : i + 1}</span><div class="main">
      <span class="one t">${esc(s.title)} ${s.running ? '<span class="pill ok">running</span>' : ""}</span>
      ${one(s.detail, "mut small")}${bar}${pr ? one(pr.text, "mut small") : ""}</div></div>`;
  }).join("");
  const head = `autopilot <span class="${P.live ? "ok" : "bad"}">${P.live ? "live" : "not running"}</span>` +
               (P.next_discover_s ? ` · next search ${dur(P.next_discover_s)}` : "");
  return `<div class="card"><h3>Pipeline <span class="sub">· ${head}</span></h3>${steps}</div>`;
}

const hhmm = t => t ? new Date(t * 1000).toLocaleTimeString([], {hour: "2-digit", minute: "2-digit", hour12: false}) : "";
const perTrade = (m, ci) => m == null ? "" : `<span class="${cls(m)}">${pct(m)}</span><span class="mut"> ±${(ci * 100).toFixed(1)}</span>`;
// "fail: interval, top 1%" (a frozen rule) or "250 trades · mean ...: plus too small to prove" (the filter's proof)
const failLabel = v => v.startsWith("fail") ? v.slice(0, 24) : v.split(":").pop().trim().slice(0, 24);
const mini = p => `<span class="mini"><i style="width:${Math.min(100, p || 0).toFixed(0)}%"></i></span>`;

// strategies with their frozen rules right under them (dashboard "Strategies and rules")
function strategies() {
  const L = S.strategies || [];
  if (!L.length) return "";
  const rows = L.map(s => {
    const rules = s.rules.map(r => {
      const state = r.status === "pass" ? '<span class="pill ok">pass</span>'
        : r.need && (r.status !== "fail" || (r.tokens || 0) < r.need)
          ? `${mini(100 * (r.tokens || 0) / r.need)} <span class="mut small">${r.tokens || 0}/${r.need}</span>`
        : `<span class="pill bad" title="${esc(r.verdict)}">${esc(failLabel(String(r.verdict)))}</span>`;
      return `<div class="rule rule-${r.status}"><span class="main">${one(r.title, "small")}
          <span class="one mut small"><b class="${cls(r.pnl_sol)}">${sol(r.pnl_sol)}</b> · ${r.n} trades${r.mean != null ? " · " + perTrade(r.mean, r.ci) : ""}</span></span>
        <span class="side">${state}</span></div>`;
    }).join("");
    return `<div class="st"><div class="st-head"><span class="main one">${esc(s.title)}</span>
        <span class="side ${cls(s.pnl_sol)}">${sol(s.pnl_sol)}</span></div>
      <div class="one mut small">since ${hhmm(s.since)} · ${s.closed} trades · ${s.tokens} tokens · win ${s.win_rate == null ? "–" : Math.round(s.win_rate * 100) + "%"}${s.open ? ` · <span style="color:var(--acc)">${s.open} open</span>` : ""}</div>
      <div class="one small">${perTrade(s.mean, s.ci) || "–"}<span class="mut">/trade · −top1%</span> <span class="${cls(s.ex_top)}">${sol(s.ex_top)}</span>
        <span class="mut">· −best</span> <span class="${cls(s.ex_wallet)}">${sol(s.ex_wallet)}</span>${s.sim != null ? ` <span class="mut">· sim ${pct(s.sim)}</span>` : ""}</div>
      ${rules}</div>`;
  }).join("");
  return `<div class="card"><h3>Strategies and rules <span class="sub">· paper, fees incl.</span></h3>${rows}
    <div class="mut small" style="margin-top:6px">±: 95% range. −top1% / −best: PnL without the top 1% of trades / the best wallet. Rules count trades after ${hhmm(S.froze)}; pass at ${S.need} tokens: range above 0 and both still positive.</div></div>`;
}

function studies() {
  const R = S.studies || [];
  if (!R.length) return "";
  const dot = {pass: "ok", fail: "bad", due: "warn"};
  return `<div class="card"><h3>Studies and checks</h3>` + R.map(r => `<div class="row"><span class="main">
      <span class="one"><span class="dot ${dot[r.status] || ""}" style="${dot[r.status] ? "" : "background:var(--acc)"}"></span>${esc(r.title)}</span>
      ${one(r.text, "mut small")}</span><span class="side">${mini(r.pct)}</span></div>`).join("") + `</div>`;
}

// server traffic / disk / memory as pills (dashboard header), amber above 80%, red above 95%
function gauges() {
  const G = S.server || [];
  const name = {traffic: "traffic", disk: "disk", memory: "mem"};
  return `<div class="gauges">` + G.map(g => {
    const c = g.pct > 95 ? "bad" : g.pct > 80 ? "warn" : "";
    const size = g.key === "traffic" ? `${Math.round(g.have)} GB/${g.need / 1000} TB` : `${g.have.toFixed(1)}/${Math.round(g.need)} GB`;
    return `<span class="pill ${c}" title="${esc(g.text)}">${name[g.key] || g.key} ${size}</span>`;
  }).join("") + (S.tg ? "" : `<span class="pill warn">TG off</span>`) + `</div>`;
}

function openCard() {
  const O = S.open || [];
  const by = {};
  O.forEach(p => by[p.group] = (by[p.group] || 0) + 1);
  const head = O.length + (O.length ? " · " + Object.keys(by).sort().map(k => `${k} ${by[k]}`).join(", ") : "");
  return `<div class="card"><h3>Open positions <span class="sub">· ${esc(head)}</span></h3>` + (O.map(p => `<div class="row"><span class="main">
       <span class="one"><b>${esc(p.group)}</b> · <a class="mono" href="https://gmgn.ai/sol/token/${esc(p.mint)}">${short(p.mint)}</a></span>
       <span class="one mut small">wallet ${short(p.wallet)} · held ${dur(p.held_s)}</span></span>
       <span class="side">${p.mult ? `<b class="${p.mult >= 1 ? "ok" : "bad"}">x${p.mult.toFixed(2)}</b>` : '<span class="mut">–</span>'}</span></div>`).join("")
     || '<span class="mut small">none</span>') + `</div>`;
}

function home() {
  return `<div class="card"><div class="row"><span class="main"><span class="one">Kill switch
        <span class="pill ${S.kill ? "bad" : "ok"}">${S.kill ? "ON: entries blocked" : "off"}</span></span></span>
      <span class="side"><button class="act ${S.kill ? "" : "danger"}" onclick='action({action:"kill_toggle"},"${S.kill ? "Turn kill switch OFF?" : "Block all new entries?"}")'>${S.kill ? "Turn off" : "Stop entries"}</button></span></div></div>
    ${gauges()}
    ${strategies()}
    ${openCard()}
    ${studies()}
    ${pipeline()}`;
}

function trades() {
  const icon = {enter: "🟢", exit: "⚪", partial_exit: "◐"};
  const rows = (S.trades || []).map(d => `<div class="row">
     <span class="main"><span class="one">${icon[d.action] || "•"} <b>${esc(d.group)}</b> <span class="mut">${esc(d.action)} · ${esc(d.reason || "")}</span></span>
       <span class="one mono mut">${d.mint ? `<a href="https://gmgn.ai/sol/token/${esc(d.mint)}">${short(d.mint)}</a>` : ""}</span></span>
     <span class="side">${d.pnl_sol != null ? `<b class="${cls(d.pnl_sol)}">${sol(d.pnl_sol)}</b><br>` : ""}
       <span class="mut small">${d.roi != null ? pct(d.roi) + " · " : ""}${ago(d.ts)}</span></span></div>`).join("");
  return `<div class="card"><h3>Trades <span class="sub">· latest</span></h3>${S.skips ? one(S.skips, "mut small") : ""}
      ${rows || '<span class="mut small">no trades yet</span>'}</div>
    <div class="card"><h3>Autopilot</h3>${(S.events || []).map(e => `<div class="row"><span class="main">${one(e.what)}</span>
       <span class="side mut small">${ago(e.ts)}</span></div>`).join("") || '<span class="mut small">no events</span>'}</div>`;
}

// feeds grouped by family with their providers as chips; drained runs and retired providers hidden (dashboard rules)
function feeds() {
  const F = S.feeds || {families: []};
  const fd = F.families.map(f => `<div class="row"><span class="main"><span class="one"><span class="dot ${f.state}"></span><b>${esc(f.name)}</b>
       <span class="mut small">${f.events.toLocaleString()} events</span></span>
       ${f.providers.length ? `<div class="chips">${f.providers.map(p => `<span class="pill"><span class="dot ${p.state}"></span>${esc(p.name)}</span>`).join("")}</div>` : ""}
       ${f.error ? one((f.state === "warn" ? ago(f.err_ts) + ": " : "") + f.short, f.state + " small") : one(f.note, "mut small")}</span>
     <span class="side mut small">${ago(f.ok_ts)}</span></div>`).join("");
  const head = `${F.live} live` + (F.bad ? ` · <span class="bad">${F.bad} failing</span>` : "") + (F.warn ? ` · <span class="warn">${F.warn} errors in 10 min</span>` : "");
  const prov = S.providers.map(p => `<div class="row"><span class="main"><span class="one"><span class="dot ${p.state}"></span>${esc(p.name)}
       ${p.public ? "<span class='mut small'>public</span>" : ""}${p.ws ? "" : " <span class='mut small'>no ws</span>"}</span>
       ${p.error ? one(p.short, (p.state === "bad" ? "bad" : "warn") + " small") : ""}</span>
     <span class="side small">${p.today.toLocaleString()}${p.budget ? `<span class="mut"> / ${Math.round(p.budget / 1000)}k</span><br>${mini(100 * p.today / p.budget)}` : ""}</span></div>`).join("");
  return `${gauges()}<div class="card"><h3>Data feeds <span class="sub">· ${head}</span></h3>${fd || "<span class='mut small'>none yet</span>"}
      ${F.quiet ? `<div class="mut small" style="margin-top:6px">${F.quiet} hidden: drained runs, retired providers, idle 1 h+</div>` : ""}</div>
     <div class="card"><h3>RPC providers <span class="sub">· calls today</span></h3>${prov}</div>`;
}

function render() {
  nav();
  if (!S) return;
  document.getElementById("view").innerHTML = ({home, trades, feeds})[tab]();
}
nav(); refresh(); setInterval(refresh, 5000);
</script>
</body>
</html>
