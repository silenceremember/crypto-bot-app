<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>crypto-bot</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:var(--tg-theme-bg-color,#fff);--fg:var(--tg-theme-text-color,#111);--mut:var(--tg-theme-hint-color,#888);
--card:var(--tg-theme-secondary-bg-color,#f2f2f5);--acc:var(--tg-theme-button-color,#2f7cf6);--accfg:var(--tg-theme-button-text-color,#fff);
--ok:#1a9a4a;--bad:#e5484d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.4 -apple-system,system-ui,Segoe UI,sans-serif}
nav{position:sticky;top:0;display:flex;background:var(--bg);border-bottom:1px solid var(--card);z-index:2}
nav button{flex:1;padding:11px 4px;border:0;background:none;color:var(--mut);font:inherit;font-weight:600}
nav button.on{color:var(--acc);box-shadow:inset 0 -2px 0 var(--acc)}
main{padding:12px 12px 40px}
.card{background:var(--card);border-radius:12px;padding:12px;margin-bottom:10px}
h3{margin:0 0 8px;font-size:13px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi b{display:block;font-size:17px}.kpi span{color:var(--mut);font-size:12px}
.row{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-top:1px solid var(--bg)}
.row:first-of-type{border-top:0}
.mut{color:var(--mut)}.ok{color:var(--ok)}.bad{color:var(--bad)}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:12px}
button.act{border:0;border-radius:10px;padding:9px 12px;background:var(--acc);color:var(--accfg);font:inherit;font-weight:600}
button.danger{background:var(--bad);color:#fff}button.ghost{background:none;color:var(--acc);padding:4px 0}
pre{white-space:pre-wrap;word-break:break-all;margin:6px 0 0;font-size:11px;color:var(--mut)}
a{color:var(--acc);text-decoration:none}
#err{display:none;background:var(--bad);color:#fff;padding:10px 12px}
</style>
</head>
<body>
<div id="err"></div>
<nav id="tabs"></nav>
<main id="view"><p class="mut">Loading…</p></main>
<script>
const tg = window.Telegram && Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }
const TABS = [["home","Overview"],["trades","Trades"],["feeds","Data"],["jobs","Jobs"]];
let tab = "home", S = null;

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const sol = x => x == null ? "–" : (x >= 0 ? "+" : "") + Number(x).toFixed(4);
const pct = x => x == null ? "–" : (x >= 0 ? "+" : "") + (x * 100).toFixed(1) + "%";
const ago = t => { if (!t) return "–"; const s = Date.now() / 1000 - t; return s < 90 ? Math.round(s) + "s" : s < 5400 ? Math.round(s / 60) + "m" : Math.round(s / 3600) + "h"; };
const short = m => esc((m || "?").slice(0, 6));
const cls = x => x == null ? "" : x > 0 ? "ok" : x < 0 ? "bad" : "";

// Served from GitHub Pages (permanent address): the data API lives on the owner's PC behind a tunnel
// whose address changes; the bot keeps it in tunnel.json of this repo. Served from the tunnel: same origin.
const ON_PAGES = location.hostname.endsWith("github.io");
let BASE = ON_PAGES ? null : "";
async function findBase() {
  const owner = location.hostname.split(".")[0], repo = location.pathname.split("/")[1];
  const r = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/tunnel.json?t=${Date.now()}`,
                        {headers: {"Accept": "application/vnd.github.raw+json"}, cache: "no-store"});
  if (!r.ok) throw new Error("Cannot read the bot address (GitHub " + r.status + ")");
  BASE = (await r.json()).api.replace(/\/$/, "");
}
async function api(path, body, retried) {
  if (BASE === null) await findBase();
  let r;
  try {
    r = await fetch(BASE + path, {method: body ? "POST" : "GET", headers: {"X-Init-Data": tg ? tg.initData : "",
                    "Content-Type": "application/json"}, body: body ? JSON.stringify(body) : undefined});
  } catch (e) { r = null; }
  // tunnel gone or moved: re-read the current address once, then retry
  if ((!r || [404, 502, 503, 530].includes(r.status)) && ON_PAGES && !retried) {
    BASE = null;
    return api(path, body, true);
  }
  if (!r) throw new Error("Bot is offline (PC or tunnel down). Retrying…");
  if (r.status === 401) throw new Error("Unauthorized: open this from your paired Telegram bot.");
  if (!r.ok) throw new Error("HTTP " + r.status);
  return r.json();
}
function showErr(e) { const b = document.getElementById("err"); b.style.display = e ? "block" : "none"; b.textContent = e || ""; }

async function refresh() {
  try { S = await api("/api/state"); showErr(""); render(); } catch (e) { showErr(e.message); }
}
const ask = t => new Promise(r => tg && tg.showConfirm ? tg.showConfirm(t, r) : r(confirm(t)));
async function action(body, confirmText) {
  if (confirmText && !(await ask(confirmText))) return;
  if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred("light");
  try { await api("/api/action", body); await refresh(); } catch (e) { showErr(e.message); }
}

function nav() {
  document.getElementById("tabs").innerHTML = TABS.map(([k, t]) =>
    `<button class="${k === tab ? "on" : ""}" onclick="tab='${k}';render()">${t}</button>`).join("");
}

function home() {
  const k = S.kpi || {};
  const risk = S.risk.map(r => `<div class="row"><span>${esc(r.key.slice(11) || "paper")}</span>
     <span class="${r.halted ? "bad" : "ok"}">${r.halted ? "HALT " + esc(r.halted) : "ok"} · ${sol(r.day_pnl)} · ${r.day_trades ?? 0}t</span></div>
     `).join("");
  const open = S.open.length ? S.open.map(p => `<div class="row"><a href="https://gmgn.ai/sol/token/${esc(p.mint)}">${short(p.mint)}</a>
     <span class="mut">${esc(p.src || "")} · ${ago(Date.now() / 1000 - p.age_s)}</span></div>`).join("") : `<p class="mut">none</p>`;
  return `<div class="card"><h3>Kill switch</h3><div class="row"><span class="${S.kill ? "bad" : "ok"}">${S.kill ? "ON: entries blocked" : "off"}</span>
      <button class="act ${S.kill ? "" : "danger"}" onclick='action({action:"kill_toggle"},"${S.kill ? "Turn kill switch OFF?" : "Block all new entries?"}")'>${S.kill ? "Turn off" : "Turn on"}</button></div></div>
    <div class="card"><h3>${esc(k.run || "No paper run yet")}</h3><div class="grid">
      <div class="kpi"><b class="${cls(k.pnl_sol)}">${sol(k.pnl_sol)}</b><span>PnL SOL</span></div>
      <div class="kpi"><b>${k.closed ?? 0}</b><span>closed</span></div>
      <div class="kpi"><b>${k.win_rate == null ? "–" : Math.round(k.win_rate * 100) + "%"}</b><span>win rate</span></div>
      <div class="kpi"><b class="${cls(k.without_top3)}">${sol(k.without_top3)}</b><span>w/o top 3</span></div>
      <div class="kpi"><b class="ok">${sol(k.best)}</b><span>best</span></div>
      <div class="kpi"><b class="bad">${sol(k.worst)}</b><span>worst</span></div></div></div>
    <div class="card"><h3>Open positions</h3>${open}</div>
    ${risk ? `<div class="card"><h3>Risk (survives restarts)</h3>${risk}</div>` : ""}
    <div class="card"><div class="row"><span>Telegram alerts</span>
      <span class="mut">${S.alerts ? "on" : "off"}</span></div>
      <div class="row"><span class="mut">mode ${esc(S.mode)} · updated</span><span class="mut">${ago(S.ts)} ago</span></div></div>`;
}

function trades() {
  const icon = {enter: "🟢", exit: "⚪", partial_exit: "◐", skip: "·", halt: "⛔"};
  return `<div class="card"><h3>Decisions (latest 40)</h3>` + S.decisions.map(d => `<div class="row">
     <span>${icon[d.action] || "•"} <b>${esc(d.action)}</b> <span class="mut">${esc(d.reason || "")}</span><br>
       <span class="mono">${d.mint ? `<a href="https://gmgn.ai/sol/token/${esc(d.mint)}">${short(d.mint)}</a>` : ""} ${d.wallet ? "· " + short(d.wallet) : ""}</span></span>
     <span style="text-align:right">${d.pnl_sol != null ? `<b class="${cls(d.pnl_sol)}">${sol(d.pnl_sol)}</b><br>` : ""}
       <span class="mut">${d.roi != null ? pct(d.roi) + " · " : ""}${ago(d.ts)}</span></span></div>`).join("") + `</div>`;
}

function feeds() {
  const prov = S.providers.map(p => `<div class="row"><span>${esc(p.name)}${p.public ? " <span class='mut'>pub</span>" : ""}</span>
     <span class="${p.score && p.score.split("/")[0] === p.score.split("/")[1] ? "ok" : p.score ? "bad" : "mut"}">${esc(p.score || "–")} · ws ${esc(p.ws || "–")}<br><span class="mut">${p.today}${p.budget ? " / " + p.budget : " · unmetered"}</span></span></div>`).join("");
  const fd = S.feeds.map(f => `<div class="row"><span>${esc(f.feed)}<br><span class="mut mono">${esc(f.ok ? (f.note || "") : (f.error || ""))}</span></span>
     <span class="${f.ok ? "ok" : "bad"}">${f.ok ? "ok" : "error"}<br><span class="mut">${ago(f.last_ok_ts)}</span></span></div>`).join("");
  return `<div class="card"><h3>RPC providers · checked ${ago(S.providers_checked)} ago</h3>${prov}</div>
     <div class="card"><h3>Data feeds</h3>${fd || "<p class='mut'>none yet</p>"}</div>`;
}

function jobs() {
  return S.jobs.map(j => `<div class="card"><div class="row"><span><b>${esc(j.title)}</b><br>
     <span class="${j.running ? "ok" : "mut"}">${j.running ? "running" : j.code == null ? "idle" : "exited " + j.code}</span></span></div>
     ${j.tail ? `<pre>${esc(j.tail)}</pre>` : ""}</div>`).join("");
}

function render() {
  nav();
  if (!S) return;
  document.getElementById("view").innerHTML = ({home, trades, feeds, jobs})[tab]();
}
nav(); refresh(); setInterval(refresh, 5000);
</script>
</body>
</html>
